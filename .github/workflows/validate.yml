name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, to catch Home Assistant changes that break the integration.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS downloads hacs.json and manifest.json from raw.githubusercontent.com
    # without a token, which returns 404 for private repos. Runs once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - run: pip install --requirement requirements_dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
